services:
  front:
    build:
      context: ./frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ./frontend:/app
    depends_on:
      - back
    environment:
      - VITE_API_URL=
      - HOST=0.0.0.0
    networks:
      - app-network

  back:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "3000:3000"
    environment:
      -  DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - JWT_SECRET=your-super-secret-jwt-key-for-docker
      - NODE_ENV=development
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-petfosterconnect}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-petfosterconnect}
      - POSTGRES_DB=${POSTGRES_DB:-petfosterconnect}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petfosterconnect}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - front
      - back
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
